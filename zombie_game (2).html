<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Zombie Game</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0a; overflow: hidden; font-family: 'Courier New', monospace; touch-action: none; }
  #gameCanvas { display: block; }
  #ui { position: fixed; top: 0; left: 0; width: 100%; pointer-events: none; }
  #hud { position: fixed; top: 12px; left: 12px; right: 12px; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; }
  .hud-left, .hud-right { display: flex; flex-direction: column; gap: 6px; }
  .bar-container { background: rgba(0,0,0,0.7); border: 1px solid #333; border-radius: 4px; padding: 4px 8px; min-width: 160px; }
  .bar-label { font-size: 10px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 3px; }
  .bar-track { height: 8px; background: #1a1a1a; border-radius: 3px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 3px; transition: width 0.15s; }
  .bar-fill.health { background: linear-gradient(90deg, #e74c3c, #c0392b); }
  .bar-fill.wall { background: linear-gradient(90deg, #f39c12, #e67e22); }
  .wave-info { background: rgba(0,0,0,0.7); border: 1px solid #333; border-radius: 4px; padding: 6px 10px; text-align: center; color: #fff; font-size: 12px; }
  .wave-num { font-size: 20px; color: #f39c12; font-weight: bold; }
  #controls { position: fixed; bottom: 0; left: 0; right: 0; height: 200px; pointer-events: none; }
  #joystickArea { position: absolute; bottom: 20px; left: 20px; width: 140px; height: 140px; pointer-events: all; }
  #joystickBase { width: 140px; height: 140px; background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.2); border-radius: 50%; position: absolute; }
  #joystickKnob { width: 56px; height: 56px; background: rgba(255,255,255,0.35); border: 2px solid rgba(255,255,255,0.6); border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); transition: background 0.1s; }
  #shootBtn { position: absolute; bottom: 30px; right: 30px; width: 90px; height: 90px; background: rgba(231,76,60,0.3); border: 3px solid rgba(231,76,60,0.7); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; color: #e74c3c; pointer-events: all; user-select: none; transition: background 0.1s; }
  #shootBtn:active, #shootBtn.active { background: rgba(231,76,60,0.6); }
  #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.88); display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; z-index: 100; }
  #overlay h1 { font-size: 42px; color: #e74c3c; text-shadow: 0 0 20px #e74c3c88; letter-spacing: 4px; margin-bottom: 8px; }
  #overlay .sub { font-size: 14px; color: #aaa; margin-bottom: 30px; letter-spacing: 2px; }
  #overlay .btn { background: #e74c3c; color: #fff; border: none; padding: 14px 40px; font-size: 16px; font-family: 'Courier New', monospace; letter-spacing: 2px; border-radius: 4px; cursor: pointer; margin-top: 10px; transition: background 0.2s; }
  #overlay .btn:hover { background: #c0392b; }
  .instructions { font-size: 12px; color: #666; margin-top: 20px; line-height: 1.8; text-align: center; }
  #waveAnnounce { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 36px; color: #f39c12; text-shadow: 0 0 20px #f39c1288; font-weight: bold; letter-spacing: 3px; pointer-events: none; opacity: 0; transition: opacity 0.4s; z-index: 50; text-align: center; }
  #scoreDisplay { background: rgba(0,0,0,0.7); border: 1px solid #333; border-radius: 4px; padding: 4px 10px; color: #fff; font-size: 12px; }
  #scoreDisplay span { color: #f39c12; font-size: 16px; font-weight: bold; }
  .teammate-bars { display: flex; flex-direction: column; gap: 3px; }
  .tm-bar { display: flex; align-items: center; gap: 6px; font-size: 10px; color: #888; }
  .tm-bar-track { flex: 1; height: 5px; background: #1a1a1a; border-radius: 2px; overflow: hidden; min-width: 60px; }
  .tm-bar-fill { height: 100%; background: #2ecc71; border-radius: 2px; transition: width 0.2s; }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="hud">
  <div class="hud-left">
    <div class="bar-container">
      <div class="bar-label">Player HP</div>
      <div class="bar-track"><div class="bar-fill health" id="playerHpBar" style="width:100%"></div></div>
    </div>
    <div class="bar-container">
      <div class="bar-label">Wall HP</div>
      <div class="bar-track"><div class="bar-fill wall" id="wallHpBar" style="width:100%"></div></div>
    </div>
    <div class="bar-container teammate-bars" id="teammateHpContainer">
      <div class="bar-label">Teammates</div>
      <div class="tm-bar"><span>T1</span><div class="tm-bar-track"><div class="tm-bar-fill" id="tm1bar" style="width:100%"></div></div></div>
      <div class="tm-bar"><span>T2</span><div class="tm-bar-track"><div class="tm-bar-fill" id="tm2bar" style="width:100%"></div></div></div>
      <div class="tm-bar"><span>T3</span><div class="tm-bar-track"><div class="tm-bar-fill" id="tm3bar" style="width:100%"></div></div></div>
    </div>
  </div>
  <div class="hud-right">
    <div class="wave-info">
      <div class="bar-label">Wave</div>
      <div class="wave-num" id="waveNum">1</div>
    </div>
    <div id="scoreDisplay">Score: <span id="scoreVal">0</span></div>
    <div class="bar-container" style="min-width:100px; text-align:center;">
      <div class="bar-label">Zombies Left</div>
      <div style="color:#e74c3c; font-size:18px; font-weight:bold;" id="zombieCount">0</div>
    </div>
  </div>
</div>
<div id="waveAnnounce"></div>
<div id="controls">
  <div id="joystickArea">
    <div id="joystickBase"></div>
    <div id="joystickKnob"></div>
  </div>
  <div id="shootBtn">🔫</div>
</div>
<div id="overlay">
  <h1>ZOMBIE GAME</h1>
  <div class="sub">SURVIVAL SHOOTER</div>
  <button class="btn" id="startBtn">▶ START GAME</button>
  <div class="instructions">
    🕹 Left joystick — Move & Aim<br>
    🔫 Right button — Shoot<br>
    Defend the base through 3 waves!
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ── Game State ──────────────────────────────────────────────
const G = {
  running: false,
  wave: 1,
  score: 0,
  zombiesLeft: 0,
  zombiesSpawned: 0,
  waveTotal: 0,
  spawnTimer: 0,
  spawnInterval: 120,
  gameOver: false,
  victory: false,
};

// ── Map / Base ───────────────────────────────────────────────
const BASE = { x: 0, y: 0, w: 300, h: 300 }; // centered at world origin
const WALL_HP_MAX = 600;
let wallHp = WALL_HP_MAX;
let wallBroken = false;

// ── Camera ───────────────────────────────────────────────────
const cam = { x: 0, y: 0 };

// ── Player ───────────────────────────────────────────────────
const PLAYER_HP_MAX = 300;
const player = {
  x: 0, y: 0,
  hp: PLAYER_HP_MAX,
  speed: 3.2,
  angle: 0,
  radius: 16,
  shootTimer: 0,
  shootCooldown: 18,
  color: '#3498db',
};

// ── Teammates ────────────────────────────────────────────────
const TM_HP_MAX = 200;
const teammates = [
  { x: -60, y: -40, angle: 0, hp: TM_HP_MAX, shootTimer: 0, radius: 14, color: '#2ecc71', label: 'T1' },
  { x:  60, y: -40, angle: 0, hp: TM_HP_MAX, shootTimer: 0, radius: 14, color: '#9b59b6', label: 'T2' },
  { x:   0, y:  60, angle: 0, hp: TM_HP_MAX, shootTimer: 0, radius: 14, color: '#f39c12', label: 'T3' },
];

// ── Bullets ──────────────────────────────────────────────────
const bullets = [];
const BULLET_SPEED = 10;
const BULLET_DMG = 30; // 3-4 shots to kill normal (90hp)

// ── Zombies ──────────────────────────────────────────────────
const zombies = [];
const ZOMBIE_TYPES = {
  normal: { hp: 90, speed: 1.1, radius: 16, color: '#27ae60', dmg: 8, wallDmg: 5, score: 10, label: 'N' },
  fast:   { hp: 60, speed: 1.9, radius: 13, color: '#16a085', dmg: 5, wallDmg: 3, score: 15, label: 'F' },
  boss:   { hp: 350, speed: 0.6, radius: 28, color: '#8e44ad', dmg: 20, wallDmg: 18, score: 50, label: 'B' },
};

// ── Particles ────────────────────────────────────────────────
const particles = [];

// ── Input ────────────────────────────────────────────────────
const joystick = { active: false, id: -1, startX: 0, startY: 0, dx: 0, dy: 0 };
let shooting = false;
let shootTouchId = -1;

// ── HUD refs ─────────────────────────────────────────────────
const elWave = document.getElementById('waveNum');
const elScore = document.getElementById('scoreVal');
const elZombieCount = document.getElementById('zombieCount');
const elPlayerHp = document.getElementById('playerHpBar');
const elWallHp = document.getElementById('wallHpBar');
const elTm = [
  document.getElementById('tm1bar'),
  document.getElementById('tm2bar'),
  document.getElementById('tm3bar'),
];
const elAnnounce = document.getElementById('waveAnnounce');
const overlay = document.getElementById('overlay');
const joystickKnob = document.getElementById('joystickKnob');
const shootBtn = document.getElementById('shootBtn');
const joystickArea = document.getElementById('joystickArea');

// ── Joystick touch ────────────────────────────────────────────
function joyRect() { return joystickArea.getBoundingClientRect(); }

joystickArea.addEventListener('touchstart', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (joystick.active) continue;
    const r = joyRect();
    joystick.active = true;
    joystick.id = t.identifier;
    joystick.startX = r.left + r.width / 2;
    joystick.startY = r.top + r.height / 2;
  }
}, { passive: false });

window.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier === joystick.id) {
      let dx = t.clientX - joystick.startX;
      let dy = t.clientY - joystick.startY;
      const dist = Math.sqrt(dx*dx + dy*dy);
      const maxR = 42;
      if (dist > maxR) { dx = dx/dist*maxR; dy = dy/dist*maxR; }
      joystick.dx = dx / maxR;
      joystick.dy = dy / maxR;
      joystickKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
    }
  }
}, { passive: false });

window.addEventListener('touchend', e => {
  for (const t of e.changedTouches) {
    if (t.identifier === joystick.id) {
      joystick.active = false; joystick.id = -1;
      joystick.dx = 0; joystick.dy = 0;
      joystickKnob.style.transform = 'translate(-50%, -50%)';
    }
    if (t.identifier === shootTouchId) {
      shooting = false; shootTouchId = -1;
      shootBtn.classList.remove('active');
    }
  }
});

shootBtn.addEventListener('touchstart', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (shootTouchId !== -1) continue;
    shooting = true;
    shootTouchId = t.identifier;
    shootBtn.classList.add('active');
  }
}, { passive: false });

// Keyboard fallback
const keys = {};
window.addEventListener('keydown', e => { keys[e.key] = true; });
window.addEventListener('keyup', e => { keys[e.key] = false; });
// Mouse shoot fallback
canvas.addEventListener('mousedown', () => { shooting = true; });
canvas.addEventListener('mouseup', () => { shooting = false; });

// ── Helpers ───────────────────────────────────────────────────
function dist(a, b) { const dx = a.x-b.x, dy = a.y-b.y; return Math.sqrt(dx*dx+dy*dy); }
function angle(from, to) { return Math.atan2(to.y - from.y, to.x - from.x); }

function spawnParticles(x, y, color, count = 6) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const spd = 1.5 + Math.random() * 3;
    particles.push({ x, y, vx: Math.cos(a)*spd, vy: Math.sin(a)*spd, life: 1, color, size: 3 + Math.random()*3 });
  }
}

function spawnZombie() {
  const types = G.wave === 1 ? ['normal','normal','fast']
               : G.wave === 2 ? ['normal','fast','normal','boss']
               : ['fast','normal','boss','fast'];
  const type = types[Math.floor(Math.random() * types.length)];
  const t = ZOMBIE_TYPES[type];
  const side = Math.floor(Math.random() * 4);
  const range = 600;
  let x, y;
  if (side === 0)      { x = -range/2 + Math.random()*range; y = -range/2; }
  else if (side === 1) { x =  range/2; y = -range/2 + Math.random()*range; }
  else if (side === 2) { x = -range/2 + Math.random()*range; y =  range/2; }
  else                 { x = -range/2; y = -range/2 + Math.random()*range; }
  zombies.push({
    x, y, hp: t.hp, maxHp: t.hp, speed: t.speed + (G.wave-1)*0.15,
    radius: t.radius, color: t.color, dmg: t.dmg, wallDmg: t.wallDmg,
    score: t.score, type, label: t.label,
    attackTimer: 0, attackCooldown: 60, stagger: 0,
  });
}

function announceWave(wave) {
  elAnnounce.textContent = `WAVE ${wave}`;
  elAnnounce.style.opacity = 1;
  setTimeout(() => { elAnnounce.style.opacity = 0; }, 2000);
}

function startWave(wave) {
  G.wave = wave;
  G.zombiesLeft = wave === 1 ? 10 : wave === 2 ? 15 : 20;
  G.waveTotal = G.zombiesLeft;
  G.zombiesSpawned = 0;
  G.spawnTimer = 0;
  G.spawnInterval = wave === 1 ? 110 : wave === 2 ? 90 : 70;
  elWave.textContent = wave;
  announceWave(wave);
}

function startGame() {
  overlay.style.display = 'none';
  G.running = true; G.gameOver = false; G.victory = false; G.score = 0; G.wave = 0;
  wallHp = WALL_HP_MAX; wallBroken = false;
  player.x = 0; player.y = 0; player.hp = PLAYER_HP_MAX; player.angle = 0; player.shootTimer = 0;
  teammates.forEach((tm, i) => { const pos = [{x:-60,y:-40},{x:60,y:-40},{x:0,y:60}][i]; tm.x=pos.x; tm.y=pos.y; tm.hp=TM_HP_MAX; tm.shootTimer=0; tm.angle=0; });
  bullets.length = 0; zombies.length = 0; particles.length = 0;
  startWave(1);
}

document.getElementById('startBtn').addEventListener('click', startGame);

// ── Wall drawing bounds ───────────────────────────────────────
const WALL_THICK = 20;
const HALF = 150; // half base width/height

function isInsideBase(x, y) {
  return x > -HALF && x < HALF && y > -HALF && y < HALF;
}

function playerCollidesWall(px, py) {
  // If wall broken don't block
  if (wallBroken) return false;
  // Keep player inside base: clamp
  return false; // handled by clamping below
}

function isOutsideBase(x, y) {
  return x < -HALF || x > HALF || y < -HALF || y > HALF;
}

// ── Update ────────────────────────────────────────────────────
function update() {
  if (!G.running) return;

  // ── Player movement ──
  let moveX = 0, moveY = 0;
  if (joystick.active) { moveX = joystick.dx; moveY = joystick.dy; }
  if (keys['ArrowLeft'] || keys['a']) moveX -= 1;
  if (keys['ArrowRight'] || keys['d']) moveX += 1;
  if (keys['ArrowUp'] || keys['w']) moveY -= 1;
  if (keys['ArrowDown'] || keys['s']) moveY += 1;

  if (moveX !== 0 || moveY !== 0) {
    const len = Math.sqrt(moveX*moveX + moveY*moveY);
    moveX /= len; moveY /= len;
    player.angle = Math.atan2(moveY, moveX);
    let nx = player.x + moveX * player.speed;
    let ny = player.y + moveY * player.speed;
    // Clamp player inside base (wall blocks if intact)
    if (!wallBroken) {
      const r = player.radius;
      nx = Math.max(-HALF + r + WALL_THICK, Math.min(HALF - r - WALL_THICK, nx));
      ny = Math.max(-HALF + r + WALL_THICK, Math.min(HALF - r - WALL_THICK, ny));
    }
    player.x = nx; player.y = ny;
  }

  // ── Player shoot ──
  if (player.shootTimer > 0) player.shootTimer--;
  if ((shooting || keys[' ']) && player.shootTimer <= 0 && player.hp > 0) {
    player.shootTimer = player.shootCooldown;
    bullets.push({ x: player.x, y: player.y, vx: Math.cos(player.angle)*BULLET_SPEED, vy: Math.sin(player.angle)*BULLET_SPEED, owner: 'player', dmg: BULLET_DMG, life: 60 });
  }

  // ── Teammates AI ──
  teammates.forEach((tm, i) => {
    if (tm.hp <= 0) return;
    // Find nearest zombie
    let nearest = null, nd = 9999;
    zombies.forEach(z => { const d = dist(tm, z); if (d < nd) { nd = d; nearest = z; } });
    if (nearest) {
      tm.angle = angle(tm, nearest);
      if (tm.shootTimer <= 0) {
        tm.shootTimer = 30 + Math.random()*20;
        bullets.push({ x: tm.x, y: tm.y, vx: Math.cos(tm.angle)*BULLET_SPEED*0.85, vy: Math.sin(tm.angle)*BULLET_SPEED*0.85, owner: 'tm', dmg: 25, life: 70 });
      }
    }
    if (tm.shootTimer > 0) tm.shootTimer--;
  });

  // ── Bullets ──
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx; b.y += b.vy; b.life--;
    if (b.life <= 0) { bullets.splice(i, 1); continue; }
    // Hit zombie
    let hit = false;
    for (let j = zombies.length - 1; j >= 0; j--) {
      const z = zombies[j];
      if (dist(b, z) < z.radius + 5) {
        z.hp -= b.dmg;
        z.stagger = 8;
        spawnParticles(z.x, z.y, '#e74c3c', 4);
        if (z.hp <= 0) {
          G.score += z.score;
          spawnParticles(z.x, z.y, z.color, 10);
          zombies.splice(j, 1);
          G.zombiesLeft--;
        }
        bullets.splice(i, 1); hit = true; break;
      }
    }
    if (hit) continue;
    // Out of range
    const range = 900;
    if (Math.abs(b.x) > range || Math.abs(b.y) > range) bullets.splice(i, 1);
  }

  // ── Zombie AI ──
  zombies.forEach(z => {
    if (z.stagger > 0) { z.stagger--; return; }
    // If wall intact, zombies target wall; if broken, target player/teammates
    if (!wallBroken) {
      // Move toward nearest wall segment
      const cx = Math.max(-HALF, Math.min(HALF, z.x));
      const cy = Math.max(-HALF, Math.min(HALF, z.y));
      const wx = z.x - cx, wy = z.y - cy;
      const wd = Math.sqrt(wx*wx+wy*wy);
      if (wd > z.radius + WALL_THICK + 5) {
        const a = Math.atan2(-wy, -wx);
        z.x += Math.cos(a) * z.speed;
        z.y += Math.sin(a) * z.speed;
      } else {
        // Attack wall
        z.attackTimer++;
        if (z.attackTimer >= z.attackCooldown) {
          z.attackTimer = 0;
          wallHp -= z.wallDmg;
          spawnParticles(z.x, z.y, '#f39c12', 3);
          if (wallHp <= 0) { wallHp = 0; wallBroken = true; }
        }
      }
    } else {
      // Target player or nearest teammate
      let targets = [player, ...teammates.filter(t => t.hp > 0)];
      let nearest = targets[0]; let nd = dist(z, targets[0]);
      targets.forEach(t => { const d = dist(z, t); if (d < nd) { nd = d; nearest = t; } });
      const a = angle(z, nearest);
      z.x += Math.cos(a) * z.speed;
      z.y += Math.sin(a) * z.speed;
      // Attack character
      if (nd < z.radius + nearest.radius + 2) {
        z.attackTimer++;
        if (z.attackTimer >= z.attackCooldown) {
          z.attackTimer = 0;
          nearest.hp -= z.dmg;
          spawnParticles(nearest.x, nearest.y, '#e74c3c', 3);
          if (nearest.hp < 0) nearest.hp = 0;
        }
      }
    }
  });

  // ── Spawn ──
  if (G.zombiesSpawned < G.waveTotal) {
    G.spawnTimer++;
    if (G.spawnTimer >= G.spawnInterval) { G.spawnTimer = 0; spawnZombie(); G.zombiesSpawned++; }
  }

  // ── Wave complete ──
  if (G.zombiesSpawned >= G.waveTotal && zombies.length === 0) {
    if (G.wave < 3) {
      setTimeout(() => startWave(G.wave + 1), 2500);
      G.zombiesSpawned = -999; // prevent re-trigger
    } else {
      G.running = false; G.victory = true;
      showEndScreen(true);
    }
  }

  // ── Game over ──
  if (player.hp <= 0) { G.running = false; G.gameOver = true; showEndScreen(false); }

  // ── Particles ──
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vx *= 0.9; p.vy *= 0.9; p.life -= 0.05;
    if (p.life <= 0) particles.splice(i, 1);
  }

  // ── Camera ──
  cam.x = player.x; cam.y = player.y;

  // ── HUD ──
  elPlayerHp.style.width = `${Math.max(0, player.hp / PLAYER_HP_MAX * 100)}%`;
  elWallHp.style.width = `${Math.max(0, wallHp / WALL_HP_MAX * 100)}%`;
  elScore.textContent = G.score;
  elZombieCount.textContent = Math.max(0, G.waveTotal - G.zombiesSpawned) + zombies.length;
  teammates.forEach((tm, i) => {
    elTm[i].style.width = `${Math.max(0, tm.hp / TM_HP_MAX * 100)}%`;
    elTm[i].style.background = tm.hp > 0 ? '#2ecc71' : '#e74c3c';
  });
}

function showEndScreen(won) {
  const overlay = document.getElementById('overlay');
  overlay.innerHTML = `
    <h1 style="color:${won?'#2ecc71':'#e74c3c'}">${won ? '🏆 VICTORY!' : '💀 GAME OVER'}</h1>
    <div class="sub">${won ? 'All waves survived!' : 'You have fallen...'}</div>
    <div style="font-size:24px; color:#f39c12; margin:16px 0;">Score: ${G.score}</div>
    <button class="btn" id="restartBtn">↺ PLAY AGAIN</button>
  `;
  overlay.style.display = 'flex';
  document.getElementById('restartBtn').addEventListener('click', startGame);
}

// ── Draw ─────────────────────────────────────────────────────
function draw() {
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);

  // Background
  ctx.fillStyle = '#0d1117';
  ctx.fillRect(0, 0, W, H);

  // Grid
  ctx.save();
  ctx.translate(W/2 - cam.x, H/2 - cam.y);
  const gsize = 50;
  ctx.strokeStyle = '#1a2030'; ctx.lineWidth = 1;
  const gx0 = Math.floor((-W/2 + cam.x) / gsize) * gsize;
  const gy0 = Math.floor((-H/2 + cam.y) / gsize) * gsize;
  for (let gx = gx0; gx < gx0 + W + gsize; gx += gsize) {
    ctx.beginPath(); ctx.moveTo(gx, gy0 - gsize); ctx.lineTo(gx, gy0 + H + gsize); ctx.stroke();
  }
  for (let gy = gy0; gy < gy0 + H + gsize; gy += gsize) {
    ctx.beginPath(); ctx.moveTo(gx0 - gsize, gy); ctx.lineTo(gx0 + W + gsize, gy); ctx.stroke();
  }

  // ── Base floor ──
  ctx.fillStyle = '#111820';
  ctx.fillRect(-HALF, -HALF, HALF*2, HALF*2);

  // ── Wall ──
  const wAlpha = wallBroken ? 0.25 : 1;
  const wColor = wallBroken ? '#555' : `hsl(${30 + (wallHp/WALL_HP_MAX)*30}, 80%, 45%)`;
  ctx.strokeStyle = wColor; ctx.lineWidth = WALL_THICK;
  ctx.globalAlpha = wAlpha;
  ctx.beginPath();
  ctx.rect(-HALF, -HALF, HALF*2, HALF*2);
  ctx.stroke();
  ctx.globalAlpha = 1;

  // Wall cracks if damaged
  if (!wallBroken && wallHp < WALL_HP_MAX) {
    const ratio = 1 - wallHp / WALL_HP_MAX;
    ctx.strokeStyle = '#000'; ctx.lineWidth = 1; ctx.globalAlpha = ratio * 0.8;
    for (let c = 0; c < Math.floor(ratio * 15); c++) {
      const cx = -HALF + Math.random() * HALF * 2;
      const cy = -HALF + Math.random() * HALF * 2;
      ctx.beginPath();
      ctx.moveTo(cx, [-HALF, HALF][Math.floor(Math.random()*2)]);
      ctx.lineTo(cx + (Math.random()-0.5)*20, [-HALF, HALF][Math.floor(Math.random()*2)]);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  // ── Particles ──
  particles.forEach(p => {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha = 1;

  // ── Bullets ──
  bullets.forEach(b => {
    ctx.save();
    ctx.fillStyle = b.owner === 'player' ? '#f1c40f' : '#a29bfe';
    ctx.shadowColor = b.owner === 'player' ? '#f1c40f' : '#6c5ce7';
    ctx.shadowBlur = 8;
    ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  });

  // ── Zombies ──
  zombies.forEach(z => {
    ctx.save();
    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(z.x + 3, z.y + 5, z.radius*0.9, z.radius*0.5, 0, 0, Math.PI*2); ctx.fill();
    // Body
    ctx.fillStyle = z.color;
    ctx.beginPath(); ctx.arc(z.x, z.y, z.radius, 0, Math.PI*2); ctx.fill();
    // Face
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(z.x - z.radius*0.4, z.y - z.radius*0.3, z.radius*0.25, z.radius*0.25);
    ctx.fillRect(z.x + z.radius*0.15, z.y - z.radius*0.3, z.radius*0.25, z.radius*0.25);
    // HP bar
    const bw = z.radius * 2.2, bh = 5;
    const bx = z.x - bw/2, by = z.y - z.radius - 12;
    ctx.fillStyle = '#1a1a1a'; ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle = z.hp > z.maxHp*0.5 ? '#2ecc71' : z.hp > z.maxHp*0.25 ? '#f39c12' : '#e74c3c';
    ctx.fillRect(bx, by, bw * (z.hp/z.maxHp), bh);
    // Label
    ctx.fillStyle = '#fff'; ctx.font = `bold ${z.type==='boss'?12:10}px monospace`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(z.label, z.x, z.y);
    ctx.restore();
  });

  // ── Teammates ──
  teammates.forEach(tm => {
    if (tm.hp <= 0) {
      // Dead cross
      ctx.save(); ctx.strokeStyle = '#e74c3c'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(tm.x-8, tm.y-8); ctx.lineTo(tm.x+8, tm.y+8); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(tm.x+8, tm.y-8); ctx.lineTo(tm.x-8, tm.y+8); ctx.stroke();
      ctx.restore();
      return;
    }
    ctx.save();
    ctx.translate(tm.x, tm.y);
    ctx.rotate(tm.angle);
    // Body
    ctx.fillStyle = tm.color;
    ctx.shadowColor = tm.color; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.arc(0, 0, tm.radius, 0, Math.PI*2); ctx.fill();
    // Gun indicator
    ctx.fillStyle = '#fff';
    ctx.fillRect(tm.radius - 4, -3, 14, 6);
    ctx.restore();
    // Label
    ctx.fillStyle = '#fff'; ctx.font = '10px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillText(tm.label, tm.x, tm.y + tm.radius + 3);
  });

  // ── Player ──
  if (player.hp > 0) {
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.rotate(player.angle);
    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(3, 6, player.radius*0.9, player.radius*0.5, 0, 0, Math.PI*2); ctx.fill();
    // Body glow
    ctx.shadowColor = player.color; ctx.shadowBlur = 15;
    ctx.fillStyle = player.color;
    ctx.beginPath(); ctx.arc(0, 0, player.radius, 0, Math.PI*2); ctx.fill();
    // Helmet
    ctx.fillStyle = '#2980b9';
    ctx.beginPath(); ctx.arc(0, -3, player.radius*0.65, Math.PI, Math.PI*2); ctx.fill();
    // Gun
    ctx.fillStyle = '#aaa';
    ctx.shadowBlur = 0;
    ctx.fillRect(player.radius - 3, -4, 18, 8);
    ctx.fillStyle = '#888';
    ctx.fillRect(player.radius + 12, -2, 6, 4);
    // You indicator
    ctx.restore();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 10px monospace'; ctx.textAlign = 'center';
    ctx.fillText('YOU', player.x, player.y - player.radius - 5);
  }

  ctx.restore(); // end world transform

  // ── HUD overlay extras ──
  // Minimap
  const mm = { x: W - 90, y: H - 90, w: 80, h: 80 };
  const scale = 80 / 600;
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.strokeStyle = '#333'; ctx.lineWidth = 1;
  ctx.fillRect(mm.x, mm.y, mm.w, mm.h);
  ctx.strokeRect(mm.x, mm.y, mm.w, mm.h);
  // Base on minimap
  ctx.fillStyle = '#1a2030';
  const bx = mm.x + mm.w/2 + (-HALF)*scale, by = mm.y + mm.h/2 + (-HALF)*scale;
  ctx.fillRect(bx, by, HALF*2*scale, HALF*2*scale);
  ctx.strokeStyle = '#f39c12'; ctx.lineWidth = 1;
  ctx.strokeRect(bx, by, HALF*2*scale, HALF*2*scale);
  // Zombies on minimap
  zombies.forEach(z => {
    ctx.fillStyle = z.color;
    ctx.beginPath(); ctx.arc(mm.x + mm.w/2 + z.x*scale, mm.y + mm.h/2 + z.y*scale, 2, 0, Math.PI*2); ctx.fill();
  });
  // Player on minimap
  ctx.fillStyle = '#3498db';
  ctx.beginPath(); ctx.arc(mm.x + mm.w/2 + player.x*scale, mm.y + mm.h/2 + player.y*scale, 3, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

// ── Loop ─────────────────────────────────────────────────────
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
